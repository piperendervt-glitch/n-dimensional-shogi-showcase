idth="2"  marker-end="url(#arr-xzw-2777b5)"/><path d="M419,325 L78,540" fill="none" stroke="#298c86" stroke-width="2"  marker-end="url(#arr-xzw-298c86)"/><text x="544" y="412" fill="#cc6c17" font-size="25" >X</text><text x="307" y="116" fill="#2777b5" font-size="25" >Z</text><text x="47" y="556" fill="#298c86" font-size="25" >W</text><path d="M419,325 L78,540" fill="none" stroke="#298c86" stroke-width="3" stroke-dasharray="7 5" /><circle cx="292" cy="405" r="12" fill="white" stroke="#182b3c" stroke-width="2.5"/><circle cx="292" cy="405" r="6" fill="#286acb"/><path d="M303,396 L390,298" fill="none" stroke="#526779" stroke-width="1.6"  /><text x="337" y="237" fill="#182b3c" font-size="23" >OとPの投影</text><text x="337" y="269" fill="#286acb" font-size="21" >ともに (0, 0, 0)</text><text x="42" y="180" fill="#182b3c" font-size="24" >4Dでは別の点</text><text x="42" y="213" fill="#526779" font-size="20" >OのY=0 ／ PのY=h</text><text x="344" y="472" fill="#298c86" font-size="20" >W方向線も重なる</text><text x="28" y="604" fill="#182b3c" font-size="23" >Yを省略するため重なる</text><text x="28" y="640" fill="#526779" font-size="21" >4DでO=Pになるわけではない</text></svg>