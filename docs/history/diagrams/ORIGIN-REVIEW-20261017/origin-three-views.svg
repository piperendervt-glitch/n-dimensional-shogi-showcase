<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="880" viewBox="0 0 1800 880" role="img"><style>text{font-family:'Meiryo','Yu Gothic UI',sans-serif;font-weight:400}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="42" fill="#182b3c" font-size="30" >説明中に置いていた仮説：O = (0, 0, 0, 0)、P = (0, h, 0, 0)</text><text x="30" y="81" fill="#526779" font-size="23" >座標順は (X, Y, Z, W)。h > 0 は距離の記号で、数値は未指定。W方向のずれは置いていない。</text><g transform="translate(0,112)"><defs><marker id="arr-xyw-182b3c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#182b3c"/></marker><marker id="arr-xyw-526779" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#526779"/></marker><marker id="arr-xyw-cc6c17" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#cc6c17"/></marker><marker id="arr-xyw-d54886" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d54886"/></marker><marker id="arr-xyw-2777b5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2777b5"/></marker><marker id="arr-xyw-298c86" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#298c86"/></marker><marker id="arr-xyw-286acb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#286acb"/></marker><marker id="arr-xyw-cad3dc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#cad3dc"/></marker></defs><text x="28" y="43" fill="#182b3c" font-size="32" >XYW</text><text x="28" y="77" fill="#526779" font-size="20" >Zを省略した座標投影（説明中の仮説）</text><path d="M68,405 L536,405" fill="none" stroke="#cc6c17" stroke-width="2"  marker-end="url(#arr-xyw-cc6c17)"/><path d="M292,469 L292,110" fill="none" stroke="#d54886" stroke-width="2"  marker-end="url(#arr-xyw-d54886)"/><path d="M419,325 L78,540" fill="none" stroke="#298c86" stroke-width="2"  marker-end="url(#arr-xyw-298c86)"/><text x="544" y="412" fill="#cc6c17" font-size="25" >X</text><text x="307" y="116" fill="#d54886" font-size="25" >Y</text><text x="47" y="556" fill="#298c86" font-size="25" >W</text><path d="M419,128 L100,329" fill="none" stroke="#298c86" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#arr-xyw-298c86)"/><text x="30" y="357" fill="#298c86" font-size="20" >Pを通るW方向</text><path d="M330,405 L330,208" fill="none" stroke="#526779" stroke-width="1.8" stroke-dasharray="4 4" /><path d="M323,405 L337,405" fill="none" stroke="#526779" stroke-width="1.8"  /><path d="M323,208 L337,208" fill="none" stroke="#526779" stroke-width="1.8"  /><text x="345" y="310" fill="#526779" font-size="25" >h</text><circle cx="292" cy="208" r="9" fill="#286acb" stroke="#182b3c" stroke-width="2"/><circle cx="292" cy="405" r="9" fill="white" stroke="#182b3c" stroke-width="2.5"/><text x="348" y="232" fill="#182b3c" font-size="22" >P：回転中心</text><text x="348" y="264" fill="#286acb" font-size="22" >(0, h, 0)</text><path d="M301,208 L337,220" fill="none" stroke="#cad3dc" stroke-width="1.4"  /><text x="347" y="449" fill="#182b3c" font-size="22" >O：盤中央</text><text x="347" y="482" fill="#182b3c" font-size="22" >(0, 0, 0)</text><text x="28" y="604" fill="#182b3c" font-size="23" >PとOのW座標は同じ</text><text x="28" y="640" fill="#526779" font-size="21" >PはOからY方向へh離れる</text></g><g transform="translate(600,112)"><defs><marker id="arr-xzw-182b3c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#182b3c"/></marker><marker id="arr-xzw-526779" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#526779"/></marker><marker id="arr-xzw-cc6c17" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#cc6c17"/></marker><marker id="arr-xzw-d54886" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d54886"/></marker><marker id="arr-xzw-2777b5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2777b5"/></marker><marker id="arr-xzw-298c86" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#298c86"/></marker><marker id="arr-xzw-286acb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#286acb"/></marker><marker id="arr-xzw-cad3dc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#cad3dc"/></marker></defs><text x="28" y="43" fill="#182b3c" font-size="32" >XZW</text><text x="28" y="77" fill="#526779" font-size="20" >Yを省略した座標投影（説明中の仮説）</text><path d="M68,405 L536,405" fill="none" stroke="#cc6c17" stroke-width="2"  marker-end="url(#arr-xzw-cc6c17)"/><path d="M292,469 L292,110" fill="none" stroke="#2777b5" stroke-width="2"  marker-end="url(#arr-xzw-2777b5)"/><path d="M419,325 L78,540" fill="none" stroke="#298c86" stroke-width="2"  marker-end="url(#arr-xzw-298c86)"/><text x="544" y="412" fill="#cc6c17" font-size="25" >X</text><text x="307" y="116" fill="#2777b5" font-size="25" >Z</text><text x="47" y="556" fill="#298c86" font-size="25" >W</text><path d="M419,325 L78,540" fill="none" stroke="#298c86" stroke-width="3" stroke-dasharray="7 5" /><circle cx="292" cy="405" r="12" fill="white" stroke="#182b3c" stroke-width="2.5"/><circle cx="292" cy="405" r="6" fill="#286acb"/><path d="M303,396 L390,298" fill="none" stroke="#526779" stroke-width="1.6"  /><text x="337" y="237" fill="#182b3c" font-size="23" >OとPの投影</text><text x="337" y="269" fill="#286acb" font-size="21" >ともに (0, 0, 0)</text><text x="42" y="180" fill="#182b3c" font-size="24" >4Dでは別の点</text><text x="42" y="213" fill="#526779" font-size="20" >OのY=0 ／ PのY=h</text><text x="344" y="472" fill="#298c86" font-size="20" >W方向線も重なる</text><text x="28" y="604" fill="#182b3c" font-size="23" >Yを省略するため重なる</text><text x="28" y="640" fill="#526779" font-size="21" >4DでO=Pになるわけではない</text></g><g transform="translate(1200,112)"><defs><marker id="arr-yzw-182b3c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#182b3c"/></marker><marker id="arr-yzw-526779" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#526779"/></marker><marker id="arr-yzw-cc6c17" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#cc6c17"/></marker><marker id="arr-yzw-d54886" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d54886"/></marker><marker id="arr-yzw-2777b5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2777b5"/></marker><marker id="arr-yzw-298c86" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#298c86"/></marker><marker id="arr-yzw-286acb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#286acb"/></marker><marker id="arr-yzw-cad3dc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#cad3dc"/></marker></defs><text x="28" y="43" fill="#182b3c" font-size="32" >YZW</text><text x="28" y="77" fill="#526779" font-size="20" >Xを省略した座標投影（説明中の仮説）</text><path d="M68,405 L536,405" fill="none" stroke="#2777b5" stroke-width="2"  marker-end="url(#arr-yzw-2777b5)"/><path d="M292,469 L292,110" fill="none" stroke="#d54886" stroke-width="2"  marker-end="url(#arr-yzw-d54886)"/><path d="M419,325 L78,540" fill="none" stroke="#298c86" stroke-width="2"  marker-end="url(#arr-yzw-298c86)"/><text x="544" y="412" fill="#2777b5" font-size="25" >Z</text><text x="307" y="116" fill="#d54886" font-size="25" >Y</text><text x="47" y="556" fill="#298c86" font-size="25" >W</text><path d="M419,128 L100,329" fill="none" stroke="#298c86" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#arr-yzw-298c86)"/><text x="30" y="357" fill="#298c86" font-size="20" >Pを通るW方向</text><path d="M330,405 L330,208" fill="none" stroke="#526779" stroke-width="1.8" stroke-dasharray="4 4" /><path d="M323,405 L337,405" fill="none" stroke="#526779" stroke-width="1.8"  /><path d="M323,208 L337,208" fill="none" stroke="#526779" stroke-width="1.8"  /><text x="345" y="310" fill="#526779" font-size="25" >h</text><circle cx="292" cy="208" r="9" fill="#286acb" stroke="#182b3c" stroke-width="2"/><circle cx="292" cy="405" r="9" fill="white" stroke="#182b3c" stroke-width="2.5"/><text x="348" y="232" fill="#182b3c" font-size="22" >P：回転中心</text><text x="348" y="264" fill="#286acb" font-size="22" >(h, 0, 0)</text><path d="M301,208 L337,220" fill="none" stroke="#cad3dc" stroke-width="1.4"  /><text x="347" y="449" fill="#182b3c" font-size="22" >O：盤中央</text><text x="347" y="482" fill="#182b3c" font-size="22" >(0, 0, 0)</text><text x="28" y="604" fill="#182b3c" font-size="23" >PとOのW座標は同じ</text><text x="28" y="640" fill="#526779" font-size="21" >PはOからY方向へh離れる</text></g><text x="30" y="843" fill="#526779" font-size="23" >座標投影による原点の確認図。各3D超平面で切った実断面や、回転後の表示を描いた図ではありません。</text></svg>